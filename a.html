<!-- The JavaScript Logic -->
<script>
    function toggleContent() {
      const content = document.getElementById("myContent");
      const button = document.querySelector("button");

      if (content.style.display === "none") {
        content.style.display = "block";  // Shows the element
        button.textContent = "Hide Content"; // Updates button text
      } else {
        content.style.display = "none";   // Hides the element
        button.textContent = "Show Content"; // Updates button text
      }
    }
    toggleContent()
</script>
